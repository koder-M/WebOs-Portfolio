<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <title>MacOs-Portfolio</title>
</head>
<body>
   <main>
        <!-- desktop -->
        <div id="desktop">
        </div>
        <div class="window" id="finderWin" data-tittle = "Finder">
            <div class="tittle-bar">
                <div class="buttons">
                    <span id="finderWin1" class="btn close"></span>
                    <span id="finderWin2" class="btn minimize" ></span>
                    <span id="finderWin3" class="btn maximize"></span>
                </div>
                <p>Finder</p>
            </div>
        </div>
        <div class="window" id="notesWin" data-title="Notes">
            <div class="tittle-bar">
                <div class="buttons">
                    <span id="notesWin1" class="btn close" ></span>
                    <span id="notesWin2" class="btn minimize" ></span>
                    <span id="notesWin3" class="btn maximize" ></span>
                </div>
                <p>Notes</p>
            </div>
            <div class="content">
                <textarea placeholder="HELLO..."></textarea>
            </div>
        </div>
        <div class="window" id="browserWin" data-title="Browser">
            <div class="tittle-bar">
                <div class="buttons">
                    <span id="browserWin1" class="btn close" ></span>
                    <span id="browserWin2" class="btn minimize" ></span>
                    <span id="browserWin3" class="btn maximize" ></span>
                </div>
                <p>Browser</p>
            </div>
            <div class="content">
                <iframe 
    src="https://www.google.com/search?q=test"
    style="width:100%; height:100%; border:none;">
</iframe>
            </div>
        </div>
        <div class="window" id="photosWin" data-tittle = "Photos">
            <div class="tittle-bar">
                <div class="buttons">
                    <span id="finderWin1" class="btn close"></span>
                    <span id="finderWin2" class="btn minimize" ></span>
                    <span id="finderWin3" class="btn maximize"></span>
                </div>
                <p>Finder</p>
            </div>
        </div>

        <div class="dock">
            <div class="dock-icon finder">
                <img src="/imgs/finder-2025-11-13.webp" alt="">
            </div>
            <div class="dock-icon nots">
                <img src="/imgs/notes-2025-11-13.webp" alt="">
            </div>
            <div class="dock-icon brwsr">
                <img src="/imgs/safari-2025-11-14.webp" alt="">
            </div>
            <div class="dock-icon photos">
                <img src="/imgs/photos-2025-11-14.webp" alt="">
            </div>
             <div class="dock-icon">
                <a href="https://www.linkedin.com/in/chetan-kumawat-2a469b336/"><img src="/imgs/Limav-Flat-Gradient-Social-Linkedin.512.png" alt=""></a>
            </div>
            <div class="dock-icon">
                <a href="https://github.com/chetankumawat13"> <img src="/imgs/github-desktop-2021-05-20.webp" alt=""></a>
            </div>
            <div class="dock-icon">
               <a href="https://www.instagram.com/koder.c13/"> <img src="/imgs/instagram-2022-05-19.webp" alt=""></a>
            </div>
        </div>
        <div class="topbar">
            <div class="left">
                <div class="ic">
                    <i class="ri-apple-fill"></i>
                </div>
                <div class="name">
                    <h4>Chetan's Portfolio</h4>
                </div>
                <a href="">Linkedin</a>
                <a href="">Github</a>
                <a href="">Instagram</a>
            </div>
            <div class="right">
                <i class="ri-wifi-fill"></i>
                <i class="ri-search-line"></i>
                <i class="ri-equalizer-2-fill"></i>
                <div class="time">
                    <p>Wed</p>
                    <p>7 May</p>
                    <p>1:37PM</p>
                </div>
            </div>
        </div>
        <div class="port">
            <p>Hey, I'm Chetan Kumawat! welcome to my </p>
            <h1>
                <span>p</span>
                <span>o</span>
                <span>r</span>
                <span>t</span>
                <span>f</span>
                <span>o</span>
                <span>l</span>
                <span>i</span>
                <span>o.</span>
            </h1>
        </div>

        <ul id="contextMenu">
            <li id="newFolderBtn" >New Folder</li>
            <li onclick="location.reload()">Refresh</li>
            <li  onclick="alert('Change Wallpaper!') , changeWal()">Change Wallpaper</li>
        </ul>
        <ul id="folderMenu">
            <li id="renameFolder">Rename</li>
            <li id="deleteFolder">Delete</li>
        </ul>
   </main>
     



    <script src="app.js"></script>
</body>
</html>
